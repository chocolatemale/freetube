name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$SIMULATOR_ID"
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild-test.log" \
            | grep -E '^(Test [Ss]uite|Test [Cc]ase|Executed|\*\* TEST|.*error: |.*Fatal error|.*failed: )' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Crash diagnostics
        if: failure()
        run: |
          echo "== test-results summary =="
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Tests.xcresult" 2>/dev/null | head -200 || true
          echo "== failing test details =="
          cat > "$RUNNER_TEMP/failures.py" <<'PY'
          import json, sys
          data = json.load(sys.stdin)
          def walk(node):
              if isinstance(node, dict):
                  if node.get("result") == "Failed" and node.get("nodeType") == "Test Case":
                      print(node.get("name"))
                      for child in node.get("children", []):
                          print("    ", child.get("nodeType"), ":", (child.get("name") or "")[:400])
                  for child in node.get("children", []):
                      walk(child)
              elif isinstance(node, list):
                  for child in node:
                      walk(child)
          walk(data.get("testNodes", data))
          PY
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/Tests.xcresult" 2>/dev/null | python3 "$RUNNER_TEMP/failures.py" || true
          echo "== crash reports =="
          mkdir -p "$RUNNER_TEMP/attachments"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Tests.xcresult" --output-path "$RUNNER_TEMP/attachments" 2>/dev/null || true
          find "$RUNNER_TEMP/attachments" -type f | head -20
          for f in $(find "$RUNNER_TEMP/attachments" ~/Library/Logs/DiagnosticReports "$RUNNER_TEMP/Tests.xcresult" \( -name '*.crash' -o -name '*.ips' \) 2>/dev/null | head -4); do
            echo "--- $f"
            python3 - "$f" <<'PY'
          import json, sys
          text = open(sys.argv[1], errors="replace").read()
          # .ips = one JSON header line + one JSON body
          try:
              body = json.loads(text.split("\n", 1)[1])
              print("exception:", body.get("exception"))
              print("termination:", body.get("termination"))
              print("asi:", body.get("asi"))
              faulting = body.get("faultingThread", 0)
              threads = body.get("threads", [])
              if threads:
                  frames = threads[faulting].get("frames", [])[:25]
                  images = body.get("usedImages", [])
                  for fr in frames:
                      img = images[fr.get("imageIndex", 0)] if fr.get("imageIndex", 0) < len(images) else {}
                      print("   ", img.get("name", "?"), fr.get("symbol", ""), "+", fr.get("imageOffset", ""), fr.get("sourceFile", ""), fr.get("sourceLine", ""))
          except Exception as e:
              print(text[:6000])
          PY
          done

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: ${{ runner.temp }}/xcodebuild-test.log
          if-no-files-found: ignore
