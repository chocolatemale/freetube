name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$SIMULATOR_ID"
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild-test.log" \
            | grep -E '^(Test [Ss]uite|Test [Cc]ase|Executed|\*\* TEST|.*error: |.*Fatal error|.*failed: )' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Crash diagnostics
        if: failure()
        run: |
          echo "== test-results summary =="
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Tests.xcresult" 2>/dev/null | head -200 || true
          echo "== failing test details =="
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/Tests.xcresult" 2>/dev/null \
            | python3 -c 'import json,sys
d=json.load(sys.stdin)
def walk(n):
    if isinstance(n,dict):
        if n.get("result")=="Failed" and n.get("nodeType")=="Test Case":
            print(n.get("name"))
            for c in n.get("children",[]):
                print("   ", c.get("nodeType"), ":", (c.get("name") or "")[:400])
        for c in n.get("children",[]): walk(c)
    elif isinstance(n,list):
        for c in n: walk(c)
walk(d.get("testNodes",d))' || true
          echo "== crash reports =="
          for f in $(find ~/Library/Logs/DiagnosticReports -name 'FreeTube*.ips' -newer "$RUNNER_TEMP/xcodebuild-test.log" 2>/dev/null | head -3); do
            echo "--- $f"; head -c 6000 "$f"; echo
          done
          for f in $(find "$RUNNER_TEMP/Tests.xcresult" -name '*.crash' -o -name '*.ips' 2>/dev/null | head -3); do
            echo "--- $f"; head -c 6000 "$f"; echo
          done

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: ${{ runner.temp }}/xcodebuild-test.log
          if-no-files-found: ignore
